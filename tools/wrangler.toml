# Deploy from the repo root:  npx wrangler deploy -c tools/wrangler.toml
# Full walkthrough in strategy/live-editing.md

# Your login can see two accounts, so name the one this belongs to: PRIMAL.
# Account IDs are not secret — they appear in dashboard URLs.
account_id = "0d725810f652de83db7340b6e2bbdf3c"

name = "pm-studio"
main = "pm-worker.js"
compatibility_date = "2026-08-01"

# npx wrangler kv namespace create PM_STUDIO  → paste the id it prints
[[kv_namespaces]]
binding = "PM_STUDIO"
id = "7a7ad04a6b9141e580fb818e2e2909d9"

# npx wrangler r2 bucket create pm-photos
[[r2_buckets]]
binding = "PM_PHOTOS"
bucket_name = "pm-photos"

[vars]
# Lock this to the real domain once DNS lands — until then "*" lets the
# GitHub Pages preview talk to it.
ALLOW_ORIGIN = "*"

# "true"  = anyone with the link can swap photographs. Correct for now.
# "false" = the write key is required.
#
#   >>> FLIP THIS TO "false" BEFORE LAUNCH, THEN REDEPLOY. <<<
OPEN_WRITES = "true"

# The write key is a secret, never a var. Set it now even while writes are
# open, so locking down later is one word and one deploy:
#   npx wrangler secret put WRITE_KEY -c tools/wrangler.toml
